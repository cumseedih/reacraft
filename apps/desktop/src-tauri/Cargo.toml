[package]
name = "kroex-desktop"
version = "1.0.0"
description = "KROEX Desktop Application"
authors = ["KROEX Team"]
edition = "2021"

[lib]
name = "kroex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
